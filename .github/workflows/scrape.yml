name: Product Specification Extractor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Extraction mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - daily
  schedule:
    # Daily price/availability update - runs every 6 hours
    - cron: '0 */6 * * *'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Product Extractor (Daily Mode - Scheduled)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_UPDATE: 'true'
        run: python main.py --daily

      - name: Run Product Extractor (Manual Mode)
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_UPDATE: ${{ github.event.inputs.mode == 'daily' && 'true' || 'false' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "daily" ]; then
            python main.py --daily
          else
            python main.py
          fi

  # Weekly full re-scrape to catch any spec changes
  full-rescrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Full Extraction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
